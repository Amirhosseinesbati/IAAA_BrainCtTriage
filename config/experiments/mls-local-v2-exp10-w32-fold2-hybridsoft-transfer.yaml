schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp10-w32-fold2-hybridsoft-transfer
notes: >-
  CUDA-only fold-2 robustness test of the experiment-08/09 hybrid-soft
  selector policy. Fold 2 was authorized only after fold 1 improved the
  previous peak-aware baseline on both the identical common grid and a
  fold-0-frozen transfer profile. Architecture, target, optimizer,
  augmentation, seed, and the evidence-bounded 23-epoch schedule are unchanged;
  no fold-2-specific tuning is permitted. Snapshots 13/15/17/19/21/23 are
  pre-registered. No CPU model fallback and no raw medical-data upload are
  allowed.
tags:
