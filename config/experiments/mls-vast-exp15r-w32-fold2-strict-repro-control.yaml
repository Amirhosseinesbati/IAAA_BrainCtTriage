run_name: mls-vast-exp15r-w32-fold2-strict-repro-control
notes: >-
  Preregistered one-factor reproducibility control after Exp14r2 produced a
  strong but differently calibrated RTX-3060 trajectory and failed its exact
  historical reproduction gate. Architecture, fold, processed data contract,
  sampler, losses, optimizer, augmentations, epoch count and validation remain
  identical to Exp14r2. The sole training change is training_determinism=strict:
  cuDNN benchmarking is disabled, deterministic CUDA algorithms fail fast,
  cuBLAS receives a deterministic workspace configuration, every epoch has an
  addressable RNG seed, and Python/NumPy DataLoader-worker RNGs are explicitly
  seeded from PyTorch. This run establishes a stable RTX-3060 control before
  any new loss or architecture intervention. Model compute is CUDA-only, no
  ICH artifact is an input, and auto-destroy is disabled.
