schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp06-w32-fold1-peakaware-transfer
notes: >-
  CUDA-only fold-1 transfer experiment for the peak-aware soft selector first
  tested in experiment 05. Training supervision, HRNet-W32 architecture,
  optimizer, augmentation, and seed are unchanged. Study validation uses the
  fold-0-derived profile locked before this run: relative-component ratio 0.7,
  selector gate 0.6, at least three active slices, unweighted q75, and a 0.5
  heatmap guard. This tests whether the fold-0 gain transfers rather than only
  reflecting post-processing overfit. No CPU model fallback and no raw medical
  data upload.
tags:
  fold: 1
  stage: local_iteration_6_peak_aware_transfer
  parent_run: mls-local-v2-exp05-w32-fold0-peakaware
