notes: >-
  Infrastructure-only retry of mls-vast-exp14-w32-fold2-hybridsoft-repro.
  The original attempt terminated before model construction because the Vast
  workspace contained DVC raw data but not the derived MLS datasets. Commit
  7c3c6eb makes prepare_data build the prerequisite positive dataset and derive
  clean-negative study truth from DVC-tracked Data/raw/training_df.pkl instead
  of an untracked EDA CSV. No epoch or MLflow training run existed for the
  failed attempt. The validated training configuration remains exactly equal
  to local Exp10 and original Exp14; only the preprocessing infrastructure and
  run identifier changed. Model compute is CUDA-only, no ICH artifact is an
  input, and the Vast instance must not auto-destroy.
