notes: >-
  Infrastructure-only retry of Exp14r1 after two pre-model failures. Exp14r1
  rebuilt 5420 rows because the current base builder samples up to three
  negatives per positive, whereas the historical Exp10 dataset contains 3484
  rows and was built with two legacy negatives per annotated study. Exp14r1
  then stopped before model construction because its metadata CSV was absent;
  it completed zero epochs and contributes no model evidence. The exact
  historical processed dataset has now been transferred with byte-identical
  directory manifests, while commit 500dfaa makes its Windows image paths and
  metadata lookup portable. The validated training configuration remains
  exactly equal to Exp10, Exp14, and Exp14r1; only data portability
  infrastructure and the immutable run identifier changed. Model compute is
  CUDA-only, no ICH artifact is an input, and the instance must not
  auto-destroy.
