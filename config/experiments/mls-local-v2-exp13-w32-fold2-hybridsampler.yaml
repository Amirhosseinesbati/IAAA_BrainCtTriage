schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp13-w32-fold2-hybridsampler
notes: >-
  CUDA-only fold-2 causal test of the preregistered midpoint sampler. Every
  model, target, loss, optimizer, augmentation, seed, batch-size,
  learning-rate, 23-epoch schedule and snapshot is identical to Exp10/Exp12.
  The only changed factor is sampling exposure: target/nontarget classes remain
  globally balanced, while each study receives mass proportional to the square
  root of its prepared row count. This is the geometric midpoint between the
  linear slice exposure of Exp10 and equal study exposure of rejected Exp12.
  The primary decision remains epoch15 on the frozen production profile; the
  secondary preregistered diagnostic is epoch13 on the already-frozen fold0/1
  transfer profile. All model computation is CUDA-only. Raw data and per-study
  predictions must remain local.
