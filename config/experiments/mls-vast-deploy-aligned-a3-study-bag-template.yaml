schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-vast-da-a3-study-bag-fold0-seed42
notes: >-
  A3 adds a low-weight, positive-study auxiliary loss while retaining A2's
  slice_class_balanced primary loader, HRNet-W32 architecture, local geometry
  losses, optimizer, augmentation, 23-epoch schedule, fold, seed and
  deployment path. For each auxiliary bag, all annotated target slices of one
  training study are passed through the existing model; the peak head forms a
  differentiable attention-weighted local MLS surrogate of the official study
  maximum. The original keypoint-derived p90/top3/gate deployment pooling is
  not changed. Epoch 15 and the fold-0 70-study resource screen are fixed
  before training.
