schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp04-w32-fold2
notes: >-
  CUDA-only third OOF confirmation of the HRNet-W32 multitask MLS model on
  competition fold 2. Architecture and training settings remain equal to
  experiments 02/03. The joint selector+heatmap component profile was frozen
  after the fold-0/fold-1 cross-transfer analysis and must not be changed using
  fold-2 labels. Best objective, best slice-MAE, and best selector-AUC
  checkpoints are retained separately for end-to-end selection analysis.
