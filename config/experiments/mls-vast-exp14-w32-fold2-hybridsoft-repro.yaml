notes: >-
  First persistent-Vast MLS run and exact controlled reproducibility anchor for
  mls-local-v2-exp10-w32-fold2-hybridsoft-transfer. The only intended changed
  factor is the compute host (RTX 3060 Vast instance); fold, data contract,
  architecture, sampler, targets, optimizer, augmentation, seed, schedule, and
  preregistered snapshots remain frozen. This run is not evidence of an
  architectural improvement by itself. It establishes that subsequent
  single-factor research experiments are comparable to the local baseline.
  Model forward, backward, and validation are CUDA-only. No ICH artifact is an
  input to this run and the server must not auto-destroy on completion.
