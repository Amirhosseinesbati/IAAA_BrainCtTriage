schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-fold0-baseline
notes: Baseline manifest; replace the fold tag/config after reviewing config/folds.csv.
tags:
  fold: 0
  stage: baseline
training_config:
  fold: 0
  use_competition_folds: true
  backbone: hrnet_w18
  input_channels: 3
  image_size: 512
  heatmap_sigma: 3.5
  mls_loss_weight: 0.25
  threshold_loss_weight: 0.1
  softargmax_temperature: 0.05
  threshold_temperature_mm: 0.5
  learning_rate: 0.0001
  weight_decay: 0.001
  head_dropout: 0.1
  epochs: 100
  batch_size: 8
  val_split: 0.2
  top_k_slices: 3
  aggregation: p90
  rotation_deg: 15.0
  translation: 0.05
  intensity_jitter: 0.05
  augment_prob: 0.9
  early_stopping_patience: 15
  lr_scheduler_patience: 5
  use_amp: true
  num_workers: 4
  seed: 42
hardware:
  gpu_profile: RTX_3090
  disk_gb: 40
  max_price_per_hour: 1.5
  min_reliability: 0.95
runtime:
  git_branch: codex/competition-winning-pipeline
  prepare_data: true
  auto_destroy: true
