schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp09-w32-fold1-hybridsoft-transfer
notes: >-
  CUDA-only fold-1 transfer test of the experiment-08 hybrid-soft selector.
  Architecture, selector target, optimizer, augmentation, pooling proxy, and
  seed remain unchanged from fold 0. The schedule is capped at epoch 23 and
  snapshots 13/15/17/19/21/23 are pre-registered because the complete fold-0
  audit found no robust benefit after epoch 23. The experiment is intended to
  validate the 75% Exp05 plus 25% hybrid ensemble without fold-specific tuning.
  No CPU model fallback and no raw medical-data upload are allowed.
