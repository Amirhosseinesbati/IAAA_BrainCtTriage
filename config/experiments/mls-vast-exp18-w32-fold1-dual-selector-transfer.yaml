run_name: mls-vast-exp18-w32-fold1-dual-selector-transfer
notes: >-
  Preregistered fold-1 dual-selector experiment after Exp17 failed the frozen
  transfer gate and failed to complement Exp09. The single conceptual change is
  decomposing the historical peak-aware selector into a binary target-presence
  head used for study gating and a relative-severity head used for slice ranking
  and weighting. Their BCE losses are averaged so the total selector-loss scale
  remains one. All data, backbone, sampler, optimizer, augmentations, schedule,
  seed, snapshots and strict CUDA determinism remain frozen. No CPU model
  fallback, warm start, pooling retune or auto-destroy is permitted.
