schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp08-w32-fold0-hybridsoft-snapshots
notes: >-
  CUDA-only fold-0 interpolation between the complementary binary and
  peak-aware selector targets. selector_peak_base=0.75 keeps strong presence
  supervision while retaining severity ordering within a positive study.
  Training runs all 30 epochs and saves sparse local snapshots for post-hoc
  full-study CUDA checkpoint selection because the annotated-slice validation
  proxy was empirically misaligned with end-to-end study inference on fold 2.
  Snapshots and raw medical data are not uploaded to MLflow; selected model,
  aggregate metrics, configuration, source and reports remain tracked.
tags:
