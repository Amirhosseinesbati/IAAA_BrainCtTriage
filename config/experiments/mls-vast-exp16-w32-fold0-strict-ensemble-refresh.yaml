run_name: mls-vast-exp16-w32-fold0-strict-ensemble-refresh
notes: >-
  Preregistered cross-fold refresh after Exp15r strict epoch17 passed its
  production gate and achieved exact packaged-runtime parity on all 67 fold-2
  studies. The deployable ensemble still contains historical benchmark-mode
  epoch15 models for fold0 and fold1. This run transfers the fully frozen
  Exp15r training recipe to fold0; the sole experimental factor is the held-out
  fold (2 -> 0). Architecture, seed, official 3484-row processed-data contract,
  sampler, losses, optimizer, augmentations, epoch count, snapshot schedule and
  strict CUDA determinism remain unchanged. No warm start, ICH input, pooling
  retune or CPU model fallback is permitted. Auto-destroy remains disabled.
