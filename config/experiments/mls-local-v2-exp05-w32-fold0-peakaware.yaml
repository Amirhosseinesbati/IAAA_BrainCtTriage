schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp05-w32-fold0-peakaware
notes: >-
  CUDA-only paired fold-0 ablation against experiment 02. The HRNet-W32
  architecture, image supervision, optimizer, augmentation, and seed remain
  fixed. The only training-target change is peak-aware soft selector
  supervision derived from each annotated slice's geometric MLS relative to
  the official max-per-study MLS. Validation and early stopping now include a
  study-level top-K quantile metric, and a dedicated best-study checkpoint is
  retained. No model-compute CPU fallback and no raw medical data upload.
