notes: >-
  Preregistered independent-fold replication after the Exp09/Exp18 fold-1
  component screen found that a fixed 90/10 blend of MLS regression outputs
  improved all frozen numerical gates. The sole training change from Exp18 is
  the held-out fold (1 -> 0). Architecture, dual-selector targets and loss
  scale, data, sampler, optimizer, augmentations, schedule, seed, snapshots and
  strict CUDA determinism remain frozen. The primary transfer test is fixed
  before training: Exp16 best-selector supplies selector, peak and heatmap;
  Exp19 epoch21 contributes 10% of mls_mm only; no profile, alpha, checkpoint
  role or threshold may be retuned on fold0. No CPU model fallback, warm start
  or auto-destroy is permitted.
