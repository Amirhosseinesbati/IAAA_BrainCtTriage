notes: >-
  Preregistered third-fold replication after the fixed regression-only 90/10
  recipe improved all frozen gates independently on fold1 (Exp09/Exp18) and
  fold0 (Exp16/Exp19). The sole training change from Exp19 is the held-out fold
  (0 -> 2). Architecture, dual-selector targets and loss scale, data, sampler,
  optimizer, augmentations, schedule, seed, snapshots and strict CUDA
  determinism remain frozen. The primary transfer test is fixed before
  training: Exp15r epoch17 supplies selector, peak and heatmap; Exp20 epoch21
  contributes 10% of mls_mm only; no profile, alpha, checkpoint role or
  threshold may be retuned on fold2. No CPU model fallback, warm start or
  auto-destroy is permitted.
