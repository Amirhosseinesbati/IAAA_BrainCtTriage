schema_version: 1
task: mls
strategy: mls_heatmap
run_name: mls-local-v2-exp07-w32-fold2-peakaware-crossfold
notes: >-
  CUDA-only fold-2 confirmation experiment for the peak-aware soft selector.
  Architecture, supervision, optimizer, augmentation, and seed are unchanged
  from experiments 05 and 06. Study validation uses the robust profile selected
  jointly on folds 0 and 1 before this run: probability-weighted relative
  component pooling with ratio 0.3, selector gate 0.7, at least one active
  slice, q75 aggregation, and no heatmap guard. Fold 2 is therefore an untouched
  transfer check for this pooling profile. No CPU model fallback and no raw
  medical data upload.
tags:
  fold: 2
  stage: local_iteration_7_peak_aware_crossfold_confirmation
  parent_runs: mls-local-v2-exp05-w32-fold0-peakaware,mls-local-v2-exp06-w32-fold1-peakaware-transfer
  changed_factor: fold_and_preregistered_crossfold_pooling_profile
  compute_policy: cuda_only
  target_contract: official_study_max
  pooling_profile_source: exp05_exp06_crossfold_frozen_before_exp07
